name: Update Subscriptions

on:
  schedule:
    # 每天在 UTC 时间每 3 小时自动触发更新
    - cron: '0 */3 * * *'
  workflow_dispatch: # 支持手动点击运行

concurrency:
  group: update-subscriptions
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install Dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Run Real-Prober and Classifier (sing-box v1.14 全协议)
        run: |
          python scripts/main_v2.py
        env:
          OUTPUT_REPOSITORY: gdject/free-MF-output
          OUTPUT_README_PATH: ${{ runner.temp }}/generated-README.md
          PYTHONUNBUFFERED: '1'

      - name: Upload test artifacts (调试用, 7天保留)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-report
          path: |
            output/e2e_test_report.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Prepare private output repository
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.OUTPUT_REPO_TOKEN }}
        run: |
          set -euo pipefail
          gh auth setup-git
          rm -rf output-repo
          mkdir output-repo
          cd output-repo
          git init -b main
          git remote add origin https://github.com/gdject/free-MF-output.git
          if git ls-remote --exit-code origin refs/heads/main >/dev/null 2>&1; then
            git fetch --depth=1 origin main
            git checkout -B main FETCH_HEAD
          else
            echo "目标仓库为空，初始化 main 分支。"
          fi

      - name: Commit and push generated artifacts
        shell: bash
        env:
          OUTPUT_REPO_TOKEN: ${{ secrets.OUTPUT_REPO_TOKEN }}
          GH_TOKEN: ${{ secrets.OUTPUT_REPO_TOKEN }}
        run: |
          set -euo pipefail
          gh auth setup-git
          mkdir -p output-repo/output
          rm -rf output-repo/output/*
          cp -R output/. output-repo/output/
          cp "$RUNNER_TEMP/generated-README.md" output-repo/README.md
          cd output-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A README.md output/
          if git diff --cached --quiet; then
            echo "目标仓库没有新的产物变动。"
            exit 0
          fi
          git commit -m "Auto Update: $(date -u '+%Y-%m-%d %H:%M:%S') UTC"
          git push origin HEAD:main
